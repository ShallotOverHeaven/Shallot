<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Oracle | Premium Decision Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030408;
            --gold-light: #fef08a;
            --gold-primary: #eab308;
            --gold-dark: #854d0e;
            --crimson: #f43f5e;
            --indigo: #6366f1;
            --glass-border: rgba(234, 179, 8, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-base);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(234, 179, 8, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 50% 80%, rgba(99, 102, 241, 0.05) 0%, transparent 60%);
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-subtitle {
            font-family: 'Cinzel', serif;
            letter-spacing: 4px;
            font-size: 0.75rem;
            color: var(--gold-primary);
            text-transform: uppercase;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, var(--gold-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            text-shadow: 0 0 30px rgba(234, 179, 8, 0.2);
        }

        .wheel-wrapper {
            position: relative;
            width: 380px;
            height: 380px;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .outer-ring {
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            background: radial-gradient(circle, transparent 60%, rgba(234, 179, 8, 0.15) 100%),
                        linear-gradient(135deg, var(--gold-primary), transparent, var(--gold-dark));
            padding: 2px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(234, 179, 8, 0.2);
        }

        .inner-ring-bg {
            width: 100%;
            height: 100%;
            background: var(--bg-base);
            border-radius: 50%;
        }

        /* Fixed pointer strictly aligned to top center (0 degrees in standard polar coords relative to top) */
        .pointer-container {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.7));
            transition: transform 0.05s ease;
        }

        .pointer-container.tick {
            transform: translateX(-50%) scale(1.15) translateY(-2px);
        }

        .pointer {
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 28px solid var(--gold-primary);
        }

        #wheelCanvas {
            width: 380px;
            height: 380px;
            border-radius: 50%;
            position: relative;
            z-index: 5;
        }

        .center-cap {
            position: absolute;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle at 35% 35%, #2a2d3d, #090b10);
            border: 3px solid var(--gold-primary);
            border-radius: 50%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.9), inset 0 0 10px rgba(234, 179, 8, 0.5);
        }

        .center-cap::after {
            content: '';
            width: 20px;
            height: 20px;
            background: var(--gold-primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--gold-primary);
        }

        .control-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-top: 25px;
        }

        .spin-btn {
            background: linear-gradient(135deg, #d97706 0%, var(--gold-primary) 50%, #b45309 100%);
            border: 1px solid var(--gold-light);
            color: #000;
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: 2px;
            padding: 16px 48px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.3), inset 0 1px 0 rgba(255,255,255,0.4);
            text-transform: uppercase;
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 35px rgba(234, 179, 8, 0.5), inset 0 1px 0 rgba(255,255,255,0.6);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .result-box {
            margin-top: 30px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-text {
            font-family: 'Cinzel', serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--gold-light);
            text-align: center;
            letter-spacing: 1px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease;
        }

        .result-text.show {
            opacity: 1;
            transform: translateY(0);
            text-shadow: 0 0 20px rgba(234, 179, 8, 0.6);
        }

        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <canvas id="confettiCanvas"></canvas>

    <div class="container">
        <header>
            <div class="brand-subtitle">Autonomous Destiny Protocol</div>
            <h1>The Decision Engine</h1>
        </header>

        <div class="wheel-wrapper">
            <div class="outer-ring"><div class="inner-ring-bg"></div></div>
            <div class="pointer-container" id="pointer">
                <div class="pointer"></div>
            </div>
            <canvas id="wheelCanvas" width="760" height="760"></canvas>
            <div class="center-cap"></div>
        </div>

        <div class="control-panel">
            <button class="spin-btn" id="spinBtn" onclick="spinWheel()">Execute Spin</button>
            <div class="result-box">
                <div class="result-text" id="resultText"></div>
            </div>
        </div>
    </div>

            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);

            pointer.classList.add('tick');
            setTimeout(() => pointer.classList.remove('tick'), 40);
        }
